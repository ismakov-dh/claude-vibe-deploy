# vibe-deploy infrastructure — Traefik + PostgreSQL
# Started by: vd init
# Managed by: vd

services:
  traefik:
    image: traefik:v3.3
    container_name: vd-traefik
    restart: unless-stopped
    command:
      # The API lives on the "traefik" entrypoint, bound to the container's own
      # loopback. It used to listen on every interface, so any container on
      # vd-net or authentik-forward could read every middleware — basicauth
      # entries and, for --auth apps, the ingress secret that is supposed to
      # prove a request came through forward auth. For operations:
      #   docker exec vd-traefik wget -qO- http://127.0.0.1:8080/api/http/routers
      - "--api.insecure=true"
      - "--entrypoints.traefik.address=127.0.0.1:8080"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=vd-net"
      # File provider: the docker provider can only point a service at a
      # container, and Authentik is a swarm service on another network.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Host nginx terminates TLS and proxies here over plain http, so the scheme
      # survives only in X-Forwarded-Proto — and Traefik's default is to distrust
      # and overwrite it. Without this the Authentik outpost builds http://
      # callbacks and login fails in a way that shows up in nothing but the
      # scheme of one Location header.
      #
      # The gateway address is filled in by `vd init` from the live network: a
      # loopback-published port reaches the container through docker-proxy, which
      # sources from the bridge gateway rather than 127.0.0.1, and Docker picks
      # that subnet per host. Neighbouring apps keep their own 172.x.x.x
      # addresses and stay untrusted, so they still cannot forge these headers.
      - "--entrypoints.web.forwardedHeaders.trustedIPs={{.TrustedIPs}}"
      - "--log.level=WARN"
      # Access log, to stdout (docker logs), for counting who still uses what —
      # e.g. Basic on an MCP (RouterName vd-<app>-mcp-basic) before switching it
      # off. Everything dropped except the fields that answer that: no path (an
      # outpost callback's query carries an auth code), no headers (Basic and
      # Bearer credentials), no client address.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultmode=drop"
      - "--accesslog.fields.names.StartUTC=keep"
      - "--accesslog.fields.names.RouterName=keep"
      - "--accesslog.fields.names.RequestHost=keep"
      - "--accesslog.fields.names.RequestMethod=keep"
      - "--accesslog.fields.names.DownstreamStatus=keep"
      - "--accesslog.fields.names.ClientUsername=keep"
      - "--accesslog.fields.names.Duration=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
    # Bounded: the access log is on every request. ~a week at this host's volume.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    networks:
      - vd-net
    labels:
      - "vd.role=traefik"

  # agentgateway in front of apps' database MCPs deployed with --mcp-oauth.
  # Its own instance, not the stacks gateway: routes change on every vd deploy,
  # and a Swarm config (what stacks uses) cannot change in place. vd rewrites
  # ./mcpgw/config.yaml and the gateway picks it up live. No port is published;
  # vd-traefik reaches it on vd-net, and it reaches the MCP containers there.
  mcpgw:
    image: {{.MCPGWImage}}
    container_name: vd-mcpgw
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      # A directory, not the file: vd replaces config.yaml by rename, and a
      # single-file bind mount would keep pointing at the old inode.
      - ./mcpgw:/etc/agentgateway:ro
    networks:
      - vd-net
    labels:
      - "vd.role=mcpgw"
      - "traefik.enable=true"
      - "traefik.http.services.vd-mcpgw.loadbalancer.server.port=3000"

  postgres:
    image: postgres:15-alpine
    container_name: vd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vd_admin
      POSTGRES_PASSWORD: ${VD_POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - vd-postgres-data:/var/lib/postgresql/data
    networks:
      - vd-db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vd_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "vd.role=postgres"

volumes:
  vd-postgres-data:

networks:
  vd-net:
    external: true
  vd-db:
    external: true
